name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b + vite build. Las VITE_* reales las pone Railway; aqui solo hace falta que compile
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.invalid
          VITE_API_KEY: ci
      - run: npm audit --audit-level=high
